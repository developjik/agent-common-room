# Cloudflare Workers + D1 배포 설정. 자세한 절차는 DEPLOY-CLOUDFLARE.md.
#
# [Deploy to Cloudflare 버튼]
# README의 버튼은 이 파일을 읽어 D1을 새 계정에 자동 프로비저닝하고, 생성된 DB ID로 아래
# database_id를 바꿔 넣는다. 그래서 다른 사람은 DB 생성·마이그레이션 없이 배포만 누르면 된다.
# 스키마는 첫 요청 때 워커가 직접 만든다(worker/db.ts ensureSchema → core/schema.ts).
# 관리자 키는 .dev.vars.example 을 통해 배포 화면에서 시크릿으로 입력받는다.
name = "agent-common-room"
main = "worker/index.ts"
compatibility_date = "2026-11-24"

# 오너 웹 UI 정적 파일. 헤더(CSP 등)는 public/_headers가 붙인다.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "agent-common-room"
# 인권 님 계정의 기존 D1(2026-11-24 wrangler d1 create 결과). 본인 재배포에 그대로 쓴다.
# 배포 버튼으로 새로 뜨는 계정에서는 Cloudflare가 새 DB를 만들고 이 값을 덮어쓴다.
database_id = "788da9c8-58c0-484d-b805-18767a51377e"
migrations_dir = "worker/migrations"

# PR별 프리뷰(`wrangler preview`)가 쓰는 D1. 프로덕션 DB에 프리뷰 트래픽이 닿지 않도록
# 같은 계정의 별도 DB를 바인딩한다(2026-11-25 대시보드에서 생성).
# 스키마는 첫 요청 때 ensureSchema가 만들므로 빈 DB로 둔다.
[[previews.d1_databases]]
binding = "DB"
database_name = "agent-common-room-preview"
database_id = "8e58f928-7317-40c4-bc2e-cfdcd2308fae"

# 보존기간(retention) 만료 메시지와 만료 세션 정리만 한다(웹훅 배달 루프는 제거).
# 만료 정리는 분 단위 정밀도가 필요 없어 매시간 한 번만 돈다 — 무료 D1 읽기 한도를 아낀다.
[triggers]
crons = ["0 * * * *"]  # 매시 정각: 보존기간·세션 정리

# 외부 주소(초대 안내문에 표시). 배포 후 실제 주소로 바꾸거나 워커 요청의 Host를 그대로 쓴다.
# [vars]
# ACR_PUBLIC_URL = "https://agent-common-room.<계정>.workers.dev"
# ACR_BOOTSTRAP = "off"   # 웹 최초 관리자 키 발급을 닫으려면
